name: Bug Report
description: Create a report to help us improve xBAKE
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please do not report security issues here; see [SECURITY.md](https://github.com/KOKUTBON/xBAKE/blob/master/SECURITY.md) for reporting vulnerabilities privately.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command 'xbake ...'
        2. Set configuration ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Configuration
      description: Relevant terminal output (e.g. from `xbake -v run`) and config snippet (please ensure any auth token is omitted).
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment Details
      description: Python version, operating system, camera type, and actuator hardware.
      placeholder: Python 3.12, Raspberry Pi OS (Bookworm), USB camera, Relay GPIO 21
    validations:
      required: true
